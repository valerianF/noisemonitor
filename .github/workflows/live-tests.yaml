name: Live tests

# Tests that query the Environment Canada service (marked live), apart from
# the main test matrix so that an outage of the service does not block it

on:
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  live:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install package with weather extras and test deps
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[weather]"
          pip install pytest

      - name: Run live tests
        run: pytest --live -m live
