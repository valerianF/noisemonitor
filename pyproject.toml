[project]
name = "noisemonitor"
version = "1.1.0"
authors = [
  { name="Valérian Fraisse", email="valerian.fraisse@mail.mcgill.ca" },
]
description = "Long-term sound level measurements analysis in Python"
readme = "README.md"
requires-python = ">=3.9"

dependencies = [
    "matplotlib >= 3.5.3",
    "numpy >= 1.22.4",
    "pandas >= 2.2",
    "python-calamine >= 0.4.0",
    "openpyxl >= 3.1.2",
]

classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: Apache Software License",
    "Operating System :: OS Independent",
]

[project.optional-dependencies]
weather = [
    "requests >= 2.25.0",
    "aiohttp >= 3.8.0",
    "lxml >= 4.6.0",
    "python-dateutil >= 2.8.0",
]

[project.urls]
"Homepage" = "https://github.com/valerianF/noisemonitor"
"Bug Tracker" = "https://github.com/valerianF/noisemonitor/issues"

[build-system]
requires = ["setuptools", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-dir]
"" = "src"

[tool.pytest.ini_options]
minversion = "6.0"
addopts = "-ra -q --strict-markers"
testpaths = [
    "tests",
]
python_files = [
    "test_*.py",
    "*_test.py",
]
python_classes = [
    "Test*",
]
python_functions = [
    "test_*",
]
markers = [
    "slow: marks tests as slow (deselect with '-m \"not slow\"')",
    # Test categories: each test has exactly one
    "external: validation against published reference values (tests/data/external)",
    "internal: validation against values derived in the test (closed-form results on synthetic signals, or another noisemonitor function)",
    "snapshot: comparison with values previously computed by noisemonitor (exact values): detects changes, does not validate",
    "behaviour: no reference value: output structure, options, errors, warnings, edge cases",
]
